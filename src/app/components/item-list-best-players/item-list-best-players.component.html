<!-- card-stats-player -->
<div
  class="py-10 flex items-center justify-between p-6 bg-primary/5 border border-primary/20 hover:bg-primary/10 transition-colors"
>
  <div class="flex items-center gap-6">
    <span class="text-primary font-black italic text-3xl">{{ index() }}</span>
    <div class="size-12 bg-primary text-black flex items-center justify-center font-black text-lg">
      {{ playerInfo()?.country }}
    </div>
    <div>
      <p class="font-bold uppercase tracking-widest text-lg">{{ playerInfo()?.username }}</p>
      <p class="text-[10px] text-primary/60 font-mono">LEVEL: {{ playerInfo()?.level }}</p>
    </div>
  </div>
  <div class="text-right">
    <p class="text-primary font-black text-2xl">{{ playerInfo()?.cpm }} CPM</p>
    <p class="text-xs text-secondary font-mono">{{ playerInfo()?.accuracy }} PRECISIÓN</p>
  </div>
</div>
