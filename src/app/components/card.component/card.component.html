<div
  class="flex flex-col min-h-32 gap-1 rounded-xl p-6 border-2 border-primary/40 hud-gradient backdrop-blur-lg hazard-glow relative overflow-hidden group"
>
  <div
    class="absolute top-0 right-0 w-full h-full bg-linear-to-br from-primary/10 to-transparent pointer-events-none"
  ></div>
  <div class="flex items-center gap-2">
    <!-- ICONO DE BOLT -->
    <span class="material-symbols-outlined text-secondary text-sm">{{ icon() }}</span>
    <p class="text-white/60 text-xs font-bold uppercase tracking-[0.2em]">Nitro-{{ textInfo() }}</p>
  </div>
  <!-- condicional -->
  @if (isAccuracyCPM()) {
    <div class="flex items-end gap-2">
      <p
        class="text-white tracking-light text-4xl font-bold leading-tight drop-shadow-[0_0_10px_rgba(255,255,0,0.4)]"
      >
        {{ cpm()?.toFixed() ?? accuracy() }}
      </p>
      <p class="text-secondary text-sm font-medium pb-1">+12%</p>
    </div>
  } @else {
    <div
      class="mt-2 h-3 w-full bg-black/40 rounded-full border border-primary/20 p-0.5 overflow-hidden"
    >
      <div
        class="h-full bg-primary bg-linear-to-r from-primary to-secondary rounded-full transition-all duration-300 ease-out"
        [style]="progress()"
      ></div>
    </div>
  }

  <!-- termina condicional -->
</div>
