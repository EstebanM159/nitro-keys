<div class="flex justify-center gap-20">
  <card
    [isAccuracyCPM]="true"
    [cpm]="stopwatchService.characterPerMinute()"
    textInfo="CPM"
    icon="bolt"
  />
  <card
    [isAccuracyCPM]="true"
    [accuracy]="stopwatchService.accuracy()"
    textInfo="Accuracy"
    icon="gps_fixed"
  />
  <card [progress]="barWidthStyle()" textInfo="progress" icon="analytics" />
</div>

<p class="text-4xl text-primary py-10">
  {{ stopwatchService.stopwatch() | date: 'mm:ss.SS' }}
</p>

<text-runner-component
  (progressBarOutput)="currentCharacterToBar.set($event)"
  (endTheGame)="isGameOver($event)"
/>
