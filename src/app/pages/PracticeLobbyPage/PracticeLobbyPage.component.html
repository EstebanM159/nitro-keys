<div class="min-h-full w-full bg-background-dark px-6 py-8 font-space text-white sm:px-10 lg:px-16">
  <!-- Selector -->
  <div class="mx-auto flex min-h-[calc(100vh-8rem)] w-full max-w-7xl gap-8 lg:gap-12">
    <section class="w-full max-w-sm" aria-labelledby="difficulty-title">
      <div class="mb-4 flex items-end justify-between gap-4">
        <h1 id="difficulty-title" class="text-sm font-bold uppercase tracking-wider">
          <span class="mr-2 text-primary">1.</span> Selecciona<br />
          <span class="ml-5">dificultad</span>
        </h1>
      </div>

      <ul class="space-y-2" aria-label="Niveles de dificultad">
        @for (difficulty of info; track difficulty.id) {
          <li>
            <button
              type="button"
              class="group w-full rounded-xl border border-white/5 bg-background-light px-3 py-3 text-left transition-colors hover:border-primary/60"
              [class.!border-primary]="selectedDifficulty() === difficulty.id"
              [class.shadow-[0_0_10px_rgba(226,236,0,0.35)]]="
                selectedDifficulty() === difficulty.id
              "
              [attr.aria-pressed]="selectedDifficulty() === difficulty.id"
              (click)="cambiarTexto($any(difficulty.id))"
            >
              <div class="flex items-start gap-3">
                <span class="pt-0.5 text-base font-bold" [class]="difficulty.color">{{
                  difficulty.number
                }}</span>
                <div class="min-w-0 flex-1">
                  <div class="flex flex-wrap items-center gap-2">
                    <h2 class="text-xs font-bold uppercase">{{ difficulty.title }}</h2>
                    @if (selectedDifficulty() === difficulty.id) {
                      <span
                        class="bg-primary px-1.5 py-0.5 text-[8px] font-bold uppercase text-background-dark"
                        >Activo</span
                      >
                    }
                  </div>
                  <p class="mt-1 max-w-lg text-[11px] leading-4 text-white/80">
                    {{ difficulty.description }}
                  </p>
                </div>
                <div class="shrink-0 text-right">
                  <strong class="block text-base font-bold" [class]="difficulty.color">{{
                    difficulty.cpm
                  }}</strong>
                  <span class="text-[10px] uppercase text-white/50">CPM base</span>
                </div>
              </div>
            </button>
          </li>
        }
      </ul>
    </section>

    <div
      class="flex min-h-64 w-full items-center justify-center border border-primary/10 bg-primary/5"
    >
      <text-runner-component />
    </div>
  </div>
</div>
